<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>24Flight - TCAS Alert Panel</title>
    <link rel="stylesheet" href="/topbar/topbar.css" />
    <link rel="stylesheet" href="css/area.css" />
    <style>
        /* App Style Guidelines */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0c0f12;
            color: #e2e8f0;
            margin: 0;
            padding: 0;
        }

        .content {
            padding: 30px;
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            color: #fff;
            font-size: 1.8rem;
            margin-top: 0;
            border-bottom: 1px solid #2d3748;
            padding-bottom: 10px;
        }

        h2 {
            font-size: 1.2rem;
            color: #a0aec0;
            margin-top: 25px;
        }

        /* Config Grid Panel Layout */
        .settings-grid {
            background: #171923;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #2d3748;
            margin-bottom: 20px;
            display: flex;
            gap: 40px;
            align-items: center;
        }

        .input-wrapper {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-wrapper label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #a0aec0;
        }

        input[type="text"] {
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #4a5568;
            background: #2d3748;
            color: #fff;
            font-size: 0.95rem;
            width: 260px;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #3182ce;
        }

        .toggle-container {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            user-select: none;
        }

        input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        /* Simplified Master Status Sign */
        .alert-status-box {
            padding: 20px;
            border-radius: 8px;
            font-weight: bold;
            text-align: center;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            background: #1a202c;
            color: #cbd5e0;
            border: 1px solid #2d3748;
            transition: all 0.2s ease;
        }

        /* Active Conflict Warning Banner State */
        .alert-status-box.active-warning {
            background: rgba(229, 62, 62, 0.2);
            color: #fff;
            border-color: #e53e3e;
            box-shadow: 0 0 15px rgba(229, 62, 62, 0.25);
        }

        /* Simplified List Grid Output View */
        table {
            width: 100%;
            border-collapse: collapse;
            background: #171923;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #2d3748;
        }

        th, td {
            padding: 12px 16px;
            text-align: left;
        }

        th {
            background: #1a202c;
            color: #cbd5e0;
            font-size: 0.8rem;
            text-transform: uppercase;
            border-bottom: 2px solid #2d3748;
        }

        td {
            border-bottom: 1px solid #2d3748;
            font-size: 0.9rem;
        }

        tr.row-conflict {
            background: rgba(229, 62, 62, 0.08);
            color: #feb2b2;
        }
    </style>
</head>
<body>

    <div class="top-bar" id="top-bar"></div>

    <div class="content">
        <h1>TCAS Monitor</h1>
        
        <div class="settings-grid">
            <div class="input-wrapper">
                <label for="player-input">Own Aircraft Callsign / Name ID</label>
                <input type="text" id="player-input" value="GreenvillSSnick" autocomplete="off" spellcheck="false" />
            </div>
            <label class="toggle-container" style="margin-top: 15px;">
                <input type="checkbox" id="tcas-toggle" checked />
                <span>Enable System Monitoring</span>
            </label>
        </div>

        <div id="tcas-alert-status" class="alert-status-box">NO CONFLICTS</div>
    </div>

    <script>
        window.topBarSettings = { title: "24Flight - TCAS" };
    </script>
    <script src="/topbar/topbar.js"></script>
    <script src="js/tcas.js"></script>
</body>
</html>
