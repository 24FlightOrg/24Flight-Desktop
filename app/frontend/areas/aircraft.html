<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aircraft</title>
  <link rel="stylesheet" href="/topbar/topbar.css" />
  <link rel="stylesheet" href="css/aircraft.css" />
</head>

<body>
  <div class="top-bar" id="top-bar"></div>

  <div id="aircraft-info">
    <div class="aircraft-card">
      <div class="status-header">
        <span class="status-label">Status</span>
        <div id="status">Loading...</div>
      </div>

      <div class="data-grid">
        <div class="data-item callsign">
          <span class="data-label">Callsign</span>
          <span class="data-value" id="callsign">-</span>
        </div>
        <div class="data-item">
          <span class="data-label">Player</span>
          <span class="data-value" id="player">-</span>
        </div>
        <div class="data-item">
          <span class="data-label">Flightplan Callsign</span>
          <span class="data-value" id="fp-callsign">-</span>
        </div>
        <div class="data-item">
          <span class="data-label">Type</span>
          <span class="data-value" id="type">-</span>
        </div>
        <div class="data-item">
          <span class="data-label">Altitude</span>
          <span class="data-value" id="alt">-</span>
        </div>
        <div class="data-item">
          <span class="data-label">Speed</span>
          <span class="data-value" id="spd">-</span>
        </div>
        <div class="data-item">
          <span class="data-label">Heading</span>
          <span class="data-value" id="hdg">-</span>
        </div>
        <div class="data-item">
          <span class="data-label">Position</span>
          <span class="data-value" id="pos">-</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    window.topBarSettings = { title: 'Aircraft' };
  </script>
  <script src="/topbar/topbar.js"></script>
  <script src="js/aircraft.js"></script>
</body>

</html>
