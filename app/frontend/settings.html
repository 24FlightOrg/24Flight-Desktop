<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Settings - 24Flight</title>
    <link rel="stylesheet" href="/topbar/topbar.css" />
    <style>
        body {
            margin: 0;
            font-family: 'Inter', 'Segoe UI', Roboto, sans-serif;
            background: #05080f;
            color: #f5f8ff;
            min-height: 100vh;
        }
        .content {
            max-width: 760px;
            margin: 90px auto 0;
            padding: 32px;
            background: rgba(20, 34, 56, 0.96);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            box-shadow: 0 22px 60px rgba(0,0,0,0.32);
        }
        h1 {
            margin: 0 0 12px;
            font-size: 2.2rem;
        }
        p {
            margin: 0;
            line-height: 1.75;
            color: #9fb4d1;
        }
        .hint {
            margin-top: 24px;
            padding: 18px;
            background: rgba(106, 156, 255, 0.08);
            border: 1px solid rgba(106, 156, 255, 0.16);
            border-radius: 18px;
        }
    </style>
</head>

<body>
    <div class="top-bar" id="top-bar"></div>
    <div class="content">
        <h1>Settings</h1>
        <p>This page is currently a placeholder. No editable settings are available yet.</p>
        <div class="hint">
            <strong>Tip:</strong> Add controls here when you want users to customize themes, data sources, or alerts.
        </div>
    </div>
    <script>
        window.topBarSettings = { title: "24Flight" };
    </script>
    <script src="/topbar/topbar.js"></script>
</body>

</html>
