<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>24Flight</title>
        <link rel="stylesheet" href="css/index.css" />
    </head>
    <body>
        <div class="top-bar">
            <div class="top-bar-content">
                <h1 class="top-bar-title">24Flight</h1>
                <span id="top-bar-username" class="top-bar-username"></span>
            </div>
            <div class="window-controls">
                <button class="window-control minimize-btn" id="minimize-btn">
                    <svg width="10" height="10" viewBox="0 0 10 10">
                        <line x1="0" y1="5" x2="10" y2="5" stroke="white" stroke-width="1"/>
                    </svg>
                </button>
                <button class="window-control maximize-btn" id="maximize-btn">
                    <svg width="10" height="10" viewBox="0 0 10 10">
                        <rect x="0" y="0" width="10" height="10" fill="none" stroke="white" stroke-width="1"/>
                    </svg>
                </button>
                <button class="window-control close-btn" id="close-btn">
                    <svg width="10" height="10" viewBox="0 0 10 10">
                        <line x1="0" y1="0" x2="10" y2="10" stroke="white" stroke-width="1.5"/>
                        <line x1="10" y1="0" x2="0" y2="10" stroke="white" stroke-width="1.5"/>
                    </svg>
                </button>
            </div>
        </div>
        <div class="page-wrap">
            <main class="card">

                <div class="tiles">
                    <a class="tile" id="btn-map" href="areas/map.html">Map</a>
                    <a class="tile" id="btn-autopilot" href="areas/autopilot.html">Autopilot</a>
                    <a class="tile" id="btn-tcas" href="areas/tcas.html">TCAS</a>
                    <a class="tile" id="btn-tcas" href="areas/tcas.html">Game Overlay</a>
                </div>
            </main>
        </div>

        <script src="js/index.js"></script>
    </body>
</html>
