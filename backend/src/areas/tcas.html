<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>24Flight - TCAS</title>
    <link rel="stylesheet" href="../topbar/topbar.css" />
    <link rel="stylesheet" href="css/area.css" />
    <style>
        .back-button {
            background: transparent;
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
            padding: 0 10px;
            display: flex;
            align-items: center;
            transition: background-color 0.2s ease;
            font-weight: 700;
        }
        .back-button:hover {
            background-color: rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <!-- Top bar with back button -->
    <div class="top-bar">
        <div class="top-bar-content">
            <div style="display: flex; align-items: center; gap: 15px; flex: 1;">
                <button class="back-button" id="back-btn" title="Go back">←</button>
                <h1 class="top-bar-title">24Flight - TCAS</h1>
            </div>
        </div>
        <div class="window-controls">
            <button class="window-control minimize-btn" id="minimize-btn">
                <svg width="10" height="10" viewBox="0 0 10 10">
                    <line x1="0" y1="5" x2="10" y2="5" stroke="white" stroke-width="1"/>
                </svg>
            </button>
            <button class="window-control maximize-btn" id="maximize-btn">
                <svg width="10" height="10" viewBox="0 0 10 10">
                    <rect x="0" y="0" width="10" height="10" fill="none" stroke="white" stroke-width="1"/>
                </svg>
            </button>
            <button class="window-control close-btn" id="close-btn">
                <svg width="10" height="10" viewBox="0 0 10 10">
                    <line x1="0" y1="0" x2="10" y2="10" stroke="white" stroke-width="1.5"/>
                    <line x1="10" y1="0" x2="0" y2="10" stroke="white" stroke-width="1.5"/>
                </svg>
            </button>
        </div>
    </div>

    <div class="content">
        <h1>TCAS</h1>
        <p>TCAS feature coming soon...</p>
    </div>

    <script>
        document.getElementById('back-btn').addEventListener('click', () => {
            window.location.href = '../index.html';
        });
    </script>
    <script src="../topbar/topbar.js"></script>
</body>
</html>
