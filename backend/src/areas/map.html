<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>24Flight - Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="/topbar/topbar.css" />
    <link rel="stylesheet" href="css/map.css" />
</head>

<body>
    <div class="top-bar" id="top-bar"></div>

    <div id="mapContainer">
      <div id="map">
      </div>
      <div class="corner-info">
        <div class="clock-row">
          <img src="https://24flight.org/unified/icons/corner-info/clock.png" alt="Clock"> <span id="utc-time">--:--:-- UTC</span>
        </div>
        <div class="wind-row">
          <img src="https://24flight.org/unified/icons/corner-info/wind.png" alt="Wind"> <span id="wind-info">---° @ --kts</span>
        </div>
      </div>
    </div>

    <script>
        window.topBarSettings = {
            title: "24Flight - Map",
        };
    </script>
    <script src="/topbar/topbar.js"></script>
    <script src="../js/data.js"></script>
    <script src="js/map.js"></script>
</body>

</html>
